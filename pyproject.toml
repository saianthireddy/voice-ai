[project]
name = "voice-ai"
version = "0.1.0"
description = "Full-duplex voice agent: STT to agent to RAG to LLM to TTS, with measured barge-in."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2"]
offline = ["faster-whisper>=1.0", "piper-tts>=1.2"]
openai = ["openai>=1.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
